[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intelapp"
version = "0.1.0"
description = "Extract rental listings from realestate.com.au and owner postal addresses from RP Data."
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.45",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "click>=8.1",
]

[project.scripts]
intelapp = "intelapp.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]
